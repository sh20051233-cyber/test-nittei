<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弓道部 日程調整 — スマホ対応 v4</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#172331;background:#f4f6f9}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.wrap{max-width:850px;margin:auto}.panel{background:white;border:1px solid #dce3ea;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:23px;margin:0 0 8px}p{line-height:1.6}.notice{background:#fff5d8;border:1px solid #e8ce87;padding:10px;border-radius:9px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:16px 0}.tool{border:1px solid #b7c3d0;background:white;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700}.tool[aria-pressed=true]{outline:3px solid #3b73c6;outline-offset:1px}.tool.yes{background:#d8f4e3}.tool.maybe{background:#fff0bd}.tool.no{background:#f9dada}.grid{display:grid;grid-template-columns:65px repeat(3,minmax(65px,1fr));gap:3px;user-select:none;touch-action:pan-y}.head{text-align:center;font-weight:700;padding:10px 2px}.time{font-size:13px;padding:11px 2px;color:#556273}.slot{min-height:42px;border:1px solid #d8e0e8;border-radius:6px;background:#f3f5f7;font-size:19px;font-weight:700;touch-action:none;cursor:crosshair;-webkit-tap-highlight-color:transparent}.slot[data-status=yes]{background:#bcebcf;color:#125d36}.slot[data-status=maybe]{background:#ffe59a;color:#805600}.slot[data-status=no]{background:#f5c6c6;color:#8b2525}button:focus-visible,input:focus-visible{outline:3px solid #366fd1}button.action{border:0;background:#245dc1;color:white;padding:11px 17px;border-radius:8px;cursor:pointer}button.secondary{border:1px solid #bbc6d1;background:white;color:#233244;padding:10px 16px;border-radius:8px;cursor:pointer}input{padding:9px;border:1px solid #aebdcc;border-radius:7px;max-width:100%}.muted{color:#667587;font-size:13px}.footer{display:flex;flex-wrap:wrap;gap:10px}#message{min-height:1.5em;color:#145c35}label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body><main class="wrap"><h1>弓道部 日程調整</h1><div class="notice"><strong>操作確認用の試作品（スマホ対応 v4）です。</strong> 回答はこのブラウザ内にのみ保存されます。共有URL・他端末編集・パスワード認証・集計はまだ動作しません。実際の部員の回答収集には使わないでください。</div><section class="panel"><h2>11月のグループ練習（サンプル）</h2><p class="muted">○・△・×を選択してから、時間枠をドラッグ（スマホでは指でなぞる）してください。選んだ記号で上書きできます。</p><div class="toolbar" role="group" aria-label="入力する回答"><button type="button" class="tool yes" data-mode="yes" aria-pressed="true">○ 参加可能</button><button type="button" class="tool maybe" data-mode="maybe" aria-pressed="false">△ 未定</button><button type="button" class="tool no" data-mode="no" aria-pressed="false">× 不可</button><button type="button" class="tool" data-mode="clear" aria-pressed="false">消去</button></div><div id="grid" class="grid" aria-label="回答表"><div class="head"></div><div class="head">11/4</div><div class="head">11/5</div><div class="head">11/6</div><div class="time">16:00</div><button type="button" class="slot" data-key="0-0" data-status="clear" aria-label="11/4 16:00 未入力">・</button><button type="button" class="slot" data-key="1-0" data-status="clear" aria-label="11/5 16:00 未入力">・</button><button type="button" class="slot" data-key="2-0" data-status="clear" aria-label="11/6 16:00 未入力">・</button><div class="time">16:30</div><button type="button" class="slot" data-key="0-1" data-status="clear" aria-label="11/4 16:30 未入力">・</button><button type="button" class="slot" data-key="1-1" data-status="clear" aria-label="11/5 16:30 未入力">・</button><button type="button" class="slot" data-key="2-1" data-status="clear" aria-label="11/6 16:30 未入力">・</button><div class="time">17:00</div><button type="button" class="slot" data-key="0-2" data-status="clear" aria-label="11/4 17:00 未入力">・</button><button type="button" class="slot" data-key="1-2" data-status="clear" aria-label="11/5 17:00 未入力">・</button><button type="button" class="slot" data-key="2-2" data-status="clear" aria-label="11/6 17:00 未入力">・</button><div class="time">17:30</div><button type="button" class="slot" data-key="0-3" data-status="clear" aria-label="11/4 17:30 未入力">・</button><button type="button" class="slot" data-key="1-3" data-status="clear" aria-label="11/5 17:30 未入力">・</button><button type="button" class="slot" data-key="2-3" data-status="clear" aria-label="11/6 17:30 未入力">・</button><div class="time">18:00</div><button type="button" class="slot" data-key="0-4" data-status="clear" aria-label="11/4 18:00 未入力">・</button><button type="button" class="slot" data-key="1-4" data-status="clear" aria-label="11/5 18:00 未入力">・</button><button type="button" class="slot" data-key="2-4" data-status="clear" aria-label="11/6 18:00 未入力">・</button><div class="time">18:30</div><button type="button" class="slot" data-key="0-5" data-status="clear" aria-label="11/4 18:30 未入力">・</button><button type="button" class="slot" data-key="1-5" data-status="clear" aria-label="11/5 18:30 未入力">・</button><button type="button" class="slot" data-key="2-5" data-status="clear" aria-label="11/6 18:30 未入力">・</button><div class="time">19:00</div><button type="button" class="slot" data-key="0-6" data-status="clear" aria-label="11/4 19:00 未入力">・</button><button type="button" class="slot" data-key="1-6" data-status="clear" aria-label="11/5 19:00 未入力">・</button><button type="button" class="slot" data-key="2-6" data-status="clear" aria-label="11/6 19:00 未入力">・</button><div class="time">19:30</div><button type="button" class="slot" data-key="0-7" data-status="clear" aria-label="11/4 19:30 未入力">・</button><button type="button" class="slot" data-key="1-7" data-status="clear" aria-label="11/5 19:30 未入力">・</button><button type="button" class="slot" data-key="2-7" data-status="clear" aria-label="11/6 19:30 未入力">・</button></div><p class="muted">未入力は「・」で表示します。タップのみでも入力できます。</p><p id="feedback" role="status" aria-live="polite" style="font-weight:700;color:#145c35">入力済み 0 枠</p><div class="footer"><button type="button" id="save" class="action">この端末に保存</button><button type="button" id="reset" class="secondary">入力をすべて消去</button></div><p id="message" role="status" aria-live="polite"></p></section></main><script>
(()=>{'use strict';const dates=['11/4','11/5','11/6'],times=['16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30'];const storageKey='kyudo-scheduler-prototype-v1';const grid=document.getElementById('grid');let mode='yes',painting=false,dragged=false,ignoreClickUntil=0;let values={};try{const parsed=JSON.parse(localStorage.getItem(storageKey)||'{}');if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed))values=parsed;}catch{}const symbols={yes:'○',maybe:'△',no:'×',clear:'・'};function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}function paint(key){if(!key)return;if(mode==='clear')delete values[key];else values[key]=mode;renderOne(key);}function renderOne(key){const b=Array.from(grid.querySelectorAll('.slot')).find(n=>n.dataset.key===key);if(!b)return;const status=values[key]||'clear';b.dataset.status=status;b.textContent=symbols[status];b.setAttribute('aria-label',`${dates[Number(key.split('-')[0])]} ${times[Number(key.split('-')[1])]} ${status==='clear'?'未入力':symbols[status]}`);}function render(){grid.querySelectorAll('.slot').forEach(b=>renderOne(b.dataset.key));}function atPointer(e){const node=document.elementFromPoint(e.clientX,e.clientY);return node && node.closest ? node.closest('.slot') : null;}// Click is the primary path for taps, keyboard and accessibility.
grid.addEventListener('click',e=>{const b=e.target.closest('.slot');if(!b||Date.now()<ignoreClickUntil)return;paint(b.dataset.key);updateFeedback();});
// Touch gestures: paint at touchstart and every crossed cell.
function touchCell(t){const n=document.elementFromPoint(t.clientX,t.clientY);return n&&n.closest?n.closest('.slot'):null;}
grid.addEventListener('touchstart',e=>{const b=touchCell(e.changedTouches[0]);if(!b||!grid.contains(b))return;painting=true;dragged=false;paint(b.dataset.key);updateFeedback();ignoreClickUntil=Date.now()+800;e.preventDefault();},{passive:false});
grid.addEventListener('touchmove',e=>{if(!painting)return;const b=touchCell(e.touches[0]);if(b&&grid.contains(b)){paint(b.dataset.key);dragged=true;updateFeedback();}e.preventDefault();},{passive:false});
for(const type of ['touchend','touchcancel'])grid.addEventListener(type,()=>{painting=false;ignoreClickUntil=Date.now()+800;});
// Mouse drag, including desktop browsers.
grid.addEventListener('mousedown',e=>{const b=e.target.closest('.slot');if(!b||e.button!==0)return;painting=true;paint(b.dataset.key);updateFeedback();ignoreClickUntil=Date.now()+200;e.preventDefault();});
grid.addEventListener('mouseover',e=>{if(!painting)return;const b=e.target.closest('.slot');if(b){paint(b.dataset.key);updateFeedback();}});
document.addEventListener('mouseup',()=>{painting=false;});
window.addEventListener('blur',()=>{painting=false;});
function updateFeedback(){const n=document.getElementById('feedback');if(n)n.textContent=`入力済み ${Object.keys(values).length} 枠（最後の操作：${symbols[mode]}）`;}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));}));document.getElementById('save').addEventListener('click',()=>{try{localStorage.setItem(storageKey,JSON.stringify(values));document.getElementById('message').textContent='このブラウザに保存しました（他端末には同期されません）。';}catch{document.getElementById('message').textContent='保存できませんでした。ブラウザの設定を確認してください。';}});document.getElementById('reset').addEventListener('click',()=>{if(!confirm('入力をすべて消去しますか？'))return;values={};render();updateFeedback();try{localStorage.removeItem(storageKey);}catch{}document.getElementById('message').textContent='入力を消去しました。';});render();updateFeedback();})();
</script></body></html>
